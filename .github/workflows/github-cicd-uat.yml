name: UAT-atgk

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - main

jobs:
#  code-test:
#    runs-on: local
  build-test:
    runs-on: ubuntu-latest
    steps:

    -
     name: Checkout
     uses: actions/checkout@v2  
    -
     name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v1
    -
     name: Login Docker Hub
     uses: docker/login-action@v1
     with: 
       username: ${{ secrets.DOCKERHUB_USERNAME }}
       password: ${{ secrets.DOCKERHUB_TOKEN }}
    -
     name: Login to GitHub Container Registry
     uses: docker/login-action@v1
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GH_TOKEN }}
    -
     name: push to docker.io
     uses: docker/build-push-action@v2
     with: 
       context: .
       file: ./Dockerfile
       push: true
       tags: |
           ${{ secrets.DOCKERHUB_USERNAME }}/${{github.event.repository.name}}:latest
          # ghcr.io/satria16alan/${{github.event.repository.name}}:latest
  containers-test:
    runs-on: ubuntu-latest
    needs: build-test
    steps: 

    - 
     name: install podman
     run: sudo apt install podman
    -
     name: podman pull 
     run: podman pull ${{ secrets.DOCKERHUB_USERNAME }}/${{github.event.repository.name}}:latest
    -
     name: podman run
     run: podman run -t test-atgk \ ${{ secrets.DOCKERHUB_USERNAME }}/${{github.event.repository.name}}:latest \ --port:80
  
